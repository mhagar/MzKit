[Processes]
verbose = False

[findmfs]
charge = 1

max_counts = C*H*N*O*P1S1
min_counts =
# When the precursor envelope shows the Cl/Br isotope pattern, these bounds
# replace the Cl/Br entries of max_counts (Cl/Br only)
detect_halogens = True
halogen_cap = Cl4Br4
min_rdbe = -1
max_rdbe = 99
check_octet = True

# Mass log likelihood
error_ppm = 5
error_da = 0.01
mass_weight = 1.0

# Isotop log likelihood
iso_weight = 1.0
iso_ppm = 5.0
iso_mz_match_da = 0.02
iso_min_rel = 0.02

# Chemical prior
chem_weight = 1.0
chem_strength = 1.0
chem_softness = 1.0

# Compound (MS2) assignment / MistNet reranker
ms2_weight = 1.0
instrument = unknown
top_n = 50

[auto_find_mfs]
# Batch runs only: which new ensembles get find-mfs, ranked by base-peak intensity
limit_count = False
max_ensembles = 200
limit_intensity = False
min_base_intsy = 100000.0

[auto_ensemble]
# Scoring
method = cosine
use_rel_intsy = True
ms1_corr_threshold = 0.9
ms2_corr_threshold = 0.8
# Seeding
parent_threshold = 10000
cofeature_threshold = 1000
# Window
window_strategy = peak_bounds
extraction_half_width = 10
min_window_halfwidth = 3
edge_fraction = 0.1
# Peak validation
peak_method = prominence
min_peak_width = 5
min_prominence = 0.2
baseline_pct = 10.0
min_turn = 0.05
# Background suppression
require_smoothing_survival = True
smoothing_sigma = 1.0
min_smoothing_survival = 0.5
reject_persistent_lanes = True
max_lane_persistence = 0.5
# Adduct-aware recruitment
adduct_aware = True
loose_corr_threshold = 0.8
adduct_ppm_tol = 20.0
polarity = 1
# DDA only: True = only ensemble MS1 features that were isolated for MS2
# (precursor seeding); False = group all coeluting MS1 features DIA-style and
# attach real triggered MS2 where available.
dda_require_ms2 = False
# RT window (minutes; rt_restrict gates whether it's applied)
rt_restrict = False
rt_start_min = 0.0
rt_end_min = 0.0

[instrument]
# Detector saturation intensity. Scans where an Ensemble's tallest ion is
# at/above this are avoided when picking its composite MS1 spectrum
saturation_threshold = 1e10

[alignment]
# Cross-sample ensemble alignment (see core/cli/align_ensembles.py)
rt_tolerance = 50.0
mz_tolerance = 0.05
ms1_similarity_threshold = 0.7

[analyte_clustering]
# Alignment Viewer cluster mode + .graphml export: MS2 similarity between
# analytes' representative spectra (see core/cli/cluster_analytes.py);
# the cosine fields only apply to scoring = modified_cosine
tolerance = 0.02
mz_power = 0.0
intensity_power = 1.0
min_matched_peaks = 3
linkage_method = average
# ms2deepscore (default; weights in models/, see tools/ms2deepscore/) or modified_cosine.
# The dialog doesn't save this: each session starts here
scoring = ms2deepscore

[sample_clustering]
# Alignment Viewer sample cluster mode + export (see core/cli/cluster_samples.py):
# Jaccard of analyte presence (an imported lineage is per session, not saved).
# ms2_grouping: first pool analytes whose MS2 dendrogram merges at
# >= ms2_threshold into one (needs an analyte clustering)
ms2_grouping = True
ms2_threshold = 0.7
linkage_method = average

[glacier]
# Search (structures) tab: rank database candidates by their GLACIER predicted
# MS2 (see core/cli/rank_candidates.py); edit from the tab's Parameters…
collision_energy = 30
# Orbitrap, QTOF, IT-FT or Unknown
instrument = Orbitrap
# m/z tolerance (Da) matching experimental to predicted peaks
mz_tolerance = 0.01
# Explained peaks: the top_n_peaks most intense experimental fragments of at
# least min_exp_rel x the base peak (precursor excluded), explained by a
# predicted peak of at least min_pred_rel x its base peak (above the grass)
top_n_peaks = 10
min_exp_rel = 0.05
min_pred_rel = 0.01
# Neutral mass search window
mass_ppm = 5.0
# Molecules per GLACIER call (progress / cancel granularity, memory)
batch_size = 32

[spectral_search]
# Search (spectra) tab: spectral libraries (spectra/*.mgf, see
# core/utils/spectrum_db.py) searched by core/cli/search_spectra.py; edit from
# the tab's Parameters…
# Identity: library precursors within this many Da (not ppm: older GNPS
# entries only give 2 decimals)
precursor_tolerance = 0.02
# m/z tolerance (Da) matching peaks (cosine, modified cosine)
mz_tolerance = 0.01
# Identity hits need at least this many matched peaks
min_matched_peaks = 3
max_hits = 100
# Analogue (embedding) search: this many nearest library spectra
top_k = 50

[structures]
# 2D structure thumbnails (gui/widgets/StructureWidget.py)
# Draw in RDKit's dark mode when the Qt palette is dark
follow_palette = true
# Size (px) of the rendering shown when hovering a thumbnail, and of Copy image
popup_width = 400
popup_height = 300

[regex]


[sampleviewer]
hide_axis_threshold_px = 50